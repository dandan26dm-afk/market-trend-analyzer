name: Daily Trend Analyzer Report

on:
  # Runs Monday-Friday at 21:00 UTC (close to the NYSE 4:00 PM ET close;
  # NYSE close is 20:00 UTC during EDT / 21:00 UTC during EST - adjust the
  # cron below if you want it pinned to a specific local close time).
  schedule:
    - cron: "0 21 * * 1-5"
  # Allows triggering the workflow manually from the Actions tab.
  workflow_dispatch: {}

jobs:
  send-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas matplotlib requests

      - name: Run Trend Analyzer Discord snapshot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python discord_snapshot.py

      - name: Upload snapshot as workflow artifact (debugging aid)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: table-snapshot
          path: table_snapshot.png
          if-no-files-found: ignore
          retention-days: 14
